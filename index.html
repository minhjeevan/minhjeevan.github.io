<script>
/* ============================================================
   EDIT YOUR SITE HERE
   Everything on the site comes from this block.
   Change the text between the quotes. Keep the quotes and commas.
   Anything written like [add ...] shows up highlighted on the
   site so you can spot what still needs filling in.

   PICTURES NEED NO CODE. Put them in a folder called "images"
   next to this file and name them after the project's "photos"
   word. For the ski lift ramp (photos: "ramp"):
       images/ramp-cover.jpg   -> picture on the home page card
       images/ramp-1.jpg       -> first picture on the project page
       images/ramp-2.jpg       -> second picture (up to ramp-6)
   .jpg, .jpeg and .png all work. Missing pictures are skipped,
   so nothing looks empty. No cover? The card uses picture 1.
   ============================================================ */

const SITE = {
  name: "Minh Vu",
  tagline: "Mechanical engineering student at Penn State",
  intro: [
    "I'm a sophomore at Penn State studying mechanical engineering, with a minor in entrepreneurship.",
    "I'm interested in aerospace and defense. I like designing things in CAD, building them, and finding out what breaks."
  ],
  email: "mjv5734@psu.edu",
  linkedin: "https://www.linkedin.com/in/minh-vu-8b73b32b7/",
  resume: ""                // the file must be named exactly resume.pdf, in the same folder as this file
};

/* ---- PROJECTS ----
   - photos:   the word your picture files start with (see the top of this file).
   - captions: optional text under each picture, in order.
               Example: captions: ["First prototype", "Final version"],
   - show:     true puts the project on the site. false hides it until it's ready.
   To add a project: copy one whole block from { to }, paste it
   where you want it in the list, and change the text.
   The id and the photos word must be unique: lowercase, dashes, no spaces.
*/
const PROJECTS = [
  {
    id: "ski-lift-ramp",
    title: "Accessible ski lift ramp",
    summary: "A ramp that uses gravity and lanes to help riders get into position for a ski lift.",
    role: "Team lead · E-Design 100 · Sep–Nov 2025",
    tags: ["Prototyping", "Accessibility", "Makerspace"],
    photos: "ramp",
    captions: [],
    show: true,
    problem: "Our class had to design something that solves a problem for people with disabilities. We picked ski lifts. Boarding is hard for riders with mobility limitations, obesity, or trouble positioning their skis.",
    did: "Our team had no clear timeline and was falling behind, so I stepped up to lead. I set deadlines, split the work into research, prototyping, and presentation phases, and assigned tasks. I also built a large share of the prototypes and made the slides. Instead of adding features to the lift, I pushed us to make it simpler. We landed on using gravity and lanes to move riders into position, with fewer parts that could break.",
    used: "Physical prototypes built in the Penn State makerspace.",
    result: "We presented on time and earned an A. We presented it as a team effort, and used the class feedback to improve the design."
  },
  {
    id: "combat-robotics",
    title: "Combat robotics",
    summary: "Co-leading a 25+ member team building a 6 lb combat robot.",
    role: "Co-lead, ASME Battlebots team · Aug 2026–present",
    tags: ["Robotics", "Electronics", "Team leadership"],
    photos: "robot",
    captions: [],
    show: true,
    problem: "Our team is building a 6 lb robot with a working weapon that one of us can drive. With 25+ people across sub-teams, keeping everyone on the same page is a challenge.",
    did: "I co-lead the logistics team and joined the electronics team to learn about batteries, ESCs, and motors. I made a shared spreadsheet with tabs for budget, parts, inventory, tasks, and roster so the whole team works from one place. I also make sure parts get checked with electronics before we order. That caught a brushed motor that wouldn't have worked with our brushless ESC, so we didn't waste money on it.",
    used: "A shared team spreadsheet, Autodesk Fusion for CAD, a brushless ESC and motors. AR500 steel is planned for the weapon.",
    result: "We've picked a chassis design and chosen our parts and electronics, and we're ordering everything now. The build should be finished in the next few months, and we compete in April 2027"
  },
  {
    id: "5-axis-3d-printer",
    title: "5-axis 3D printer",
    summary: "Building a 5-axis 3D printer with a club team, and documenting it so others can build one.",
    role: "Team member · Open Build Outsource Projects Club · Aug 2026–present",
    tags: ["CAD", "Assembly", "Motion systems"],
    photos: "printer",
    captions: [],
    show: true,
    problem: "Our club is building a 5-axis 3D printer, a more complex motion system than a standard printer. We also want other people to be able to build their own.",
    did: "I'm working on the mechanical design, CAD, and assembly. We're documenting the whole build, including design decisions, assembly steps, and troubleshooting.",
    used: "Autodesk Fusion. Penn State makerspace with 3D printers to print parts.",
    result: "In progress."
  },
  {
    id: "hybrid-work-model",
    title: "Adaptive hybrid-work model",
    summary: "A more flexible model for hybrid work, shaped by interviews with hybrid workers.",
    role: "Team member · E-Design 100 · Nov–Dec 2025",
    tags: ["User interviews", "Concept design", "Teamwork"],
    photos: "hybrid",
    link: "https://docs.google.com/presentation/d/e/2PACX-1vTaM80zN1f-bem3GhNl8rd5mQX2G8q991EHz3HDNhPcEONf-UnhYFg_BTevjIyasqs_aJbtI56urgUJ/pub?start=false&loop=false&",
    captions: [],
    show: true,
    problem: "Existing hybrid-work software is too rigid for the people who use it.",
    did: "We interviewed hybrid workers to find their pain points, then used their feedback to check our design decisions as we went. I worked on the design, modeling, and presentation phases with my team.",
    used: "Interviews with hybrid workers and iterative feedback. Google Slides.",
    result: "A conceptual model for a more flexible alternative, which we presented to the class."
  },
     {
    id: "personal-cad-model",
    title: "Eagle glasses holder",
    summary: "A glasses holder shaped like an eagle, designed on my own in Autodesk Fusion.",
    role: "Solo project",
    tags: ["Autodesk Fusion", "CAD", "Assembly"],
    photos: "cad",
    captions: [],
    show: true,
    problem: "The goal was to design something that improves my living space. It had to do something useful and not be something you can buy off the shelf. I needed a place to put my glasses, so I made a holder that's also fun to look at.",
    did: "I designed an eagle-shaped glasses holder in Fusion. It's an assembly of 5 parts and took me about 10 hours. I made it personal to me. This project was where I learned new Fusion tools: embossing, debossing, and decals.",
    used: "Autodesk Fusion. It has no electronics, and I didn't 3D print it.",
    result: "A finished 5-part eagle glasses holder, fully modeled in Fusion."
  },
   {
    id: "3d-printed-minifigure",
    title: "3D printed minifigure",
    summary: "A Toad figure I designed in CAD and 3D printed, with 9 parts that press-fit together.",
    role: "Solo project",
    tags: ["Autodesk Fusion", "3D printing", "Design for 3D printing"],
    photos: "minifigure",
    captions: [],
    show: true,
    problem: "Design a character in separate parts that can be 3D printed and then assembled with no glue or screws. The whole figure had to fit in a 5 x 4 x 4 inch space.",
    did: "I picked Toad from Mario and modeled him in 9 parts. I added connectors on one part and matching holes on the other so they press-fit together after printing. I used a 0.15 mm tolerance, and planned the prints around orientation, supports, and infill.",
    used: "Autodesk Fusion for CAD and Prusa 3D printers.",
    result: "The first print didn't fit together, so I fixed the size of the connecting portions."
  }
];

/* ---- CLUBS ----
   To add a club: copy a line, paste it, change the text. */
const CLUBS = [
  { name: "ASME", detail: "Co-lead on the Battlebots team (25+ members). I work on logistics and electronics." },
  { name: "The Open Build Club", detail: "Building and documenting a 5-axis 3D printer with a team." }
];

/* ============ END OF THE PART YOU EDIT ============ */
</script>

<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f6f8;
    --text: #15181d;
    --muted: #5b6370;
    --line: #e2e5ea;
    --accent: #1f4fd8;
    --accent-soft: #e8eefc;
    --todo-bg: #fff3c4;
    --todo-text: #6b4e00;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1216;
    --surface: #181c22;
    --text: #e9ecf1;
    --muted: #9aa3b1;
    --line: #2a2f38;
    --accent: #8fb0ff;
    --accent-soft: #1b2540;
    --todo-bg: #4a3a00;
    --todo-text: #ffe28a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216;
      --surface: #181c22;
      --text: #e9ecf1;
      --muted: #9aa3b1;
      --line: #2a2f38;
      --accent: #8fb0ff;
      --accent-soft: #1b2540;
      --todo-bg: #4a3a00;
      --todo-text: #ffe28a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 1.5rem; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* Header */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  header.top .wrap { display: flex; align-items: center; gap: 1rem; height: 3.75rem; }
  .brand { font-weight: 700; color: var(--text); text-decoration: none; margin-right: auto; }
  nav { display: flex; gap: 1.25rem; }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  nav a:hover { color: var(--text); }
  .theme-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 0.3rem 0.8rem; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .theme-btn:hover { background: var(--surface); }

  /* Sections */
  section { padding: 4.5rem 0; }
  section + section { border-top: 1px solid var(--line); }
  .label {
    font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 1rem;
  }
  h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 1.25rem; text-wrap: balance; }
  h2 { font-size: 1.6rem; letter-spacing: -0.01em; margin: 0 0 2rem; }
  .intro p { max-width: 38rem; margin: 0 0 0.9rem; font-size: 1.15rem; color: var(--muted); }
  .intro p:first-of-type { color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
  .btn {
    display: inline-block; padding: 0.65rem 1.15rem; border-radius: 8px;
    text-decoration: none; font-weight: 600; font-size: 0.95rem;
    border: 1px solid var(--line); color: var(--text); background: var(--bg);
  }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn.primary:hover { opacity: 0.9; }

  /* Project cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
  .card {
    display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    text-decoration: none; color: var(--text); background: var(--bg);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card .body { padding: 1.1rem 1.2rem 1.3rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
  .card h3 { margin: 0; font-size: 1.1rem; line-height: 1.3; }
  .card p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
  .card .more { margin-top: auto; padding-top: 0.6rem; color: var(--accent); font-size: 0.9rem; font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; margin: 0; padding: 0; }
  .tags li { font-size: 0.75rem; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

  /* Image slots */
  .shot { aspect-ratio: 16 / 10; width: 100%; background: var(--surface); display: block; object-fit: cover; }

  /* Clubs */
  .clubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .clubs li { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
  .clubs li:first-child { border-top: 1px solid var(--line); }
  .clubs strong { font-weight: 650; }
  .clubs span { color: var(--muted); }

  /* Contact */
  .contact p { max-width: 34rem; color: var(--muted); margin: 0 0 1.5rem; }
  .contact-links { display: flex; flex-direction: column; gap: 0.6rem; font-size: 1.1rem; }

  /* Project detail page */
  .detail { padding: 3rem 0 5rem; }
  .back { display: inline-block; margin-bottom: 2rem; text-decoration: none; font-size: 0.95rem; }
  .detail h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); margin-bottom: 0.75rem; }
  .detail .role { color: var(--muted); margin: 0 0 1rem; }
  .detail .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin: 2.25rem 0 0; }
  .detail figure { margin: 0; }
  .detail figure .shot { border-radius: 10px; }
  .detail figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; }
  .facts { display: grid; gap: 0; margin: 2.25rem 0 0; }
  .facts > div { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; padding: 1.4rem 0; border-top: 1px solid var(--line); }
  .facts dt { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); padding-top: 0.3rem; }
  .facts dd { margin: 0; max-width: 36rem; }

  /* Fill-in notes */
  mark.todo {
    background: var(--todo-bg); color: var(--todo-text);
    padding: 0.05rem 0.35rem; border-radius: 4px; font-size: 0.9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  footer { border-top: 1px solid var(--line); padding: 2rem 0 3rem; color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    section { padding: 3.25rem 0; }
    nav { gap: 0.9rem; }
    nav a { font-size: 0.88rem; }
    .clubs li, .facts > div { grid-template-columns: 1fr; gap: 0.25rem; }
    .theme-btn span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card { transition: none; }
  }
</style>
</head>

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav aria-label="Main">
      <a href="#projects">Projects</a>
      <a href="#clubs">Clubs</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between light and dark mode"></button>
  </div>
</header>

<main id="home">
  <section class="intro" id="top">
    <div class="wrap">
      <p class="label mono" id="tagline"></p>
      <h1 id="hello"></h1>
      <div id="introText"></div>
      <div class="actions" id="introActions"></div>
    </div>
  </section>

  <section id="projects">
    <div class="wrap">
      <p class="label mono">Projects</p>
      <h2>Things I've built</h2>
      <div class="grid" id="projectGrid"></div>
    </div>
  </section>

  <section id="clubs">
    <div class="wrap">
      <p class="label mono">Clubs</p>
      <h2>What I'm part of</h2>
      <ul class="clubs" id="clubList"></ul>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <p class="label mono">Contact</p>
      <h2>Get in touch</h2>
      <p>Email is the best way to reach me. I'm happy to talk about my projects or send my resume.</p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>
</main>

<main id="detail" class="detail" hidden>
  <div class="wrap" id="detailBody"></div>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<script>
(function () {
  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // Escapes text and highlights any [add ...] notes.
  function text(s) {
    return esc(s).replace(/\[add[^\]]*\]/gi, function (m) { return '<mark class="todo">' + m + "</mark>"; });
  }
  function $(id) { return document.getElementById(id); }

  // Only projects with show: true appear on the site.
  var VISIBLE = PROJECTS.filter(function (p) { return p.show !== false; });

  // ---------- pictures ----------
  // Looks in the images folder for the first file that exists.
  // names: file names without the ending, tried in order.
  var EXTS = ["jpg", "jpeg", "png", "JPG", "JPEG", "PNG"];
  var found = {};
  function findImage(names, done) {
    var key = names.join("|");
    if (key in found) return done(found[key]);
    var tries = [];
    names.forEach(function (n) { EXTS.forEach(function (e) { tries.push("images/" + n + "." + e); }); });
    (function next(i) {
      if (i >= tries.length) { found[key] = null; return done(null); }
      var im = new Image();
      im.onload = function () { found[key] = tries[i]; done(tries[i]); };
      im.onerror = function () { next(i + 1); };
      im.src = tries[i];
    })(0);
  }

  // ---------- home page ----------
  $("brand").textContent = SITE.name;
  $("tagline").innerHTML = text(SITE.tagline);
  $("hello").innerHTML = "Hi, I'm " + text(SITE.name) + ".";
  $("introText").innerHTML = SITE.intro.map(function (p) { return "<p>" + text(p) + "</p>"; }).join("");

  var actions = '<a class="btn primary" href="#projects">See my projects</a>';
  if (SITE.resume) actions += '<a class="btn" href="' + esc(SITE.resume) + '">Resume</a>';
  actions += '<a class="btn" href="#contact">Contact me</a>';
  $("introActions").innerHTML = actions;

  $("projectGrid").innerHTML = VISIBLE.map(function (p) {
    return '<a class="card" href="#/project/' + esc(p.id) + '">' +
      '<div class="body">' +
        "<h3>" + text(p.title) + "</h3>" +
        "<p>" + text(p.summary) + "</p>" +
        '<ul class="tags">' + (p.tags || []).map(function (t) { return "<li>" + text(t) + "</li>"; }).join("") + "</ul>" +
        '<span class="more">Read more →</span>' +
      "</div></a>";
  }).join("");

  // Add a cover picture to each card if one exists. No picture means a text-only card.
  VISIBLE.forEach(function (p, i) {
    if (!p.photos) return;
    findImage([p.photos + "-cover", p.photos + "-1"], function (url) {
      if (!url) return;
      var img = document.createElement("img");
      img.className = "shot"; img.src = url; img.alt = p.title;
      var card = $("projectGrid").children[i];
      card.insertBefore(img, card.firstChild);
    });
  });

  $("clubList").innerHTML = CLUBS.map(function (c) {
    return "<li><strong>" + text(c.name) + "</strong><span>" + text(c.detail) + "</span></li>";
  }).join("");

  var links = "";
  links += SITE.email
    ? '<a href="mailto:' + esc(SITE.email) + '">' + esc(SITE.email) + "</a>"
    : '<span><mark class="todo">[add email]</mark></span>';
  links += SITE.linkedin
    ? '<a href="' + esc(SITE.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>'
    : '<span><mark class="todo">[add LinkedIn link]</mark></span>';
  $("contactLinks").innerHTML = links;

  $("footer").innerHTML = "© " + new Date().getFullYear() + " " + text(SITE.name);

  // ---------- project detail page ----------
  function renderDetail(p) {
    function row(label, value) {
      return "<div><dt class=\"mono\">" + label + "</dt><dd>" + text(value || "[add detail]") + "</dd></div>";
    }

    $("detailBody").innerHTML =
      '<a class="back" href="#projects">← All projects</a>' +
      '<p class="label mono">Project</p>' +
      "<h1>" + text(p.title) + "</h1>" +
      '<p class="role">' + text(p.role || "") + "</p>" +
      '<ul class="tags">' + (p.tags || []).map(function (t) { return "<li>" + text(t) + "</li>"; }).join("") + "</ul>" +
            (p.link ? '<p style="margin:1.5rem 0 0"><a class="btn primary" href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.linkLabel || "Try the prototype") + ' ↗</a></p>' : "") +'<div class="gallery" id="gallery" hidden></div>' +
      '<dl class="facts">' +
        row("The problem", p.problem) +
        row("What I did", p.did) +
        row("What I used", p.used) +
        row("The result", p.result) +
      "</dl>";

    // Show pictures 1 to 6 from the images folder. Missing ones are skipped.
    var gallery = $("gallery");
    for (var n = 1; n <= 6 && p.photos; n++) (function (n) {
      var fig = document.createElement("figure");
      fig.hidden = true;
      gallery.appendChild(fig);
      findImage([p.photos + "-" + n], function (url) {
        if (!url) return;
        var cap = (p.captions || [])[n - 1];
        fig.innerHTML = '<img class="shot" src="' + esc(url) + '" alt="' + esc(cap || p.title + ", picture " + n) + '">' +
          (cap ? "<figcaption>" + text(cap) + "</figcaption>" : "");
        fig.hidden = false;
        gallery.hidden = false;
      });
    })(n);
  }

  // ---------- simple page switching ----------
  var baseTitle = document.title;
  function route() {
    var hash = location.hash || "";
    var match = hash.match(/^#\/project\/(.+)$/);
    var project = match && VISIBLE.filter(function (p) { return p.id === decodeURIComponent(match[1]); })[0];

    if (project) {
      renderDetail(project);
      $("home").hidden = true;
      $("detail").hidden = false;
      document.title = project.title + " | " + SITE.name;
      window.scrollTo(0, 0);
    } else {
      var wasDetail = !$("detail").hidden;
      $("detail").hidden = true;
      $("home").hidden = false;
      document.title = baseTitle;
      if (wasDetail) {
        var target = hash.length > 1 && document.getElementById(hash.slice(1));
        if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
      }
    }
  }
  window.addEventListener("hashchange", route);
  route();

  // ---------- light / dark mode ----------
  var root = document.documentElement;
  var btn = $("themeBtn");
  function currentTheme() {
    return root.getAttribute("data-theme") ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function paintButton() {
    btn.innerHTML = currentTheme() === "dark" ? "☀ <span>Light</span>" : "☾ <span>Dark</span>";
  }
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  } catch (e) {}
  paintButton();
  btn.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paintButton();
  });
})();
</script>
</body>
</html>
